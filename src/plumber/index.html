<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pipe-works</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        margin: 0;
        min-height: 100vh;
        color: #edf3ff;
        background:
          radial-gradient(circle at 14% 0%, #213b5b 0, transparent 32rem),
          #09111d;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 72px 24px;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 30px;
      }
      .eyebrow {
        margin: 0 0 9px;
        color: #82b7ff;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: -0.06em;
      }
      .subtitle {
        margin: 10px 0 0;
        color: #a9b7c9;
      }
      .count {
        color: #a9b7c9;
        font-size: 0.86rem;
        white-space: nowrap;
      }
      #pipelines {
        display: grid;
        gap: 14px;
      }
      .pipeline-card {
        display: grid;
        grid-template-columns: minmax(150px, 1fr) auto minmax(150px, 1fr) auto;
        align-items: center;
        gap: 22px;
        padding: 22px 24px;
        border: 1px solid #263c58;
        border-radius: 20px;
        background: linear-gradient(
          115deg,
          rgba(26, 46, 70, 0.92),
          rgba(14, 25, 39, 0.92)
        );
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        transition:
          border-color 0.2s,
          transform 0.2s;
      }
      .pipeline-card:hover {
        border-color: #4974a7;
        transform: translateY(-2px);
      }
      .pipeline-name {
        min-width: 0;
      }
      .pipeline-name small,
      .node small {
        display: block;
        margin-bottom: 5px;
        color: #8495ab;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .pipeline-name strong {
        display: block;
        overflow: hidden;
        color: #fff;
        font-size: 1.1rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .flow {
        display: flex;
        align-items: center;
        min-width: 130px;
        color: #56708f;
      }
      .flow::before,
      .flow::after {
        content: "";
        height: 2px;
        flex: 1;
        background: currentColor;
        opacity: 0.6;
      }
      .flow svg {
        margin: 0 -1px;
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .node {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .node-icon {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 12px;
        background: #172b42;
        color: #b7d7ff;
      }
      .node-icon svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
      }
      .node .endpoint-state {
        color: #ced9e7;
        font-size: 0.88rem;
      }
      .endpoint-statuses {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .endpoint-status {
        color: #8495ab;
        font-size: 0.68rem;
        white-space: nowrap;
      }
      .endpoint-status strong { font-weight: 700; }
      .endpoint-status.connected strong { color: #65e6a9; }
      .endpoint-status.disconnected strong { color: #f19aa7; }
      .statistics {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        margin: 0;
        padding-top: 4px;
      }
      .statistic {
        min-width: 0;
        padding: 11px 12px;
        border: 1px solid #263c58;
        border-radius: 12px;
        background: rgba(7, 16, 28, 0.38);
      }
      .statistic dt {
        overflow: hidden;
        color: #8495ab;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .statistic dd {
        margin: 5px 0 0;
        color: #f3f8ff;
        font-size: 1.05rem;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
      }
      .statistic.success dd { color: #65e6a9; }
      .statistic.failure dd { color: #f19aa7; }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid #36526f;
        border-radius: 11px;
        color: #dbeaff;
        background: #172b42;
        cursor: pointer;
        transition:
          transform 0.15s,
          background 0.15s;
      }
      button:hover {
        background: #25496d;
        transform: translateY(-1px);
      }
      button.stop:hover {
        background: #66313c;
        border-color: #a94d5c;
      }
      button svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .pipeline-card.is-running .flow {
        color: #4ee3a3;
      }
      .pipeline-card.is-running .node-icon {
        background: #164937;
        color: #74f0bd;
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 7px;
        color: #8ca0b8;
        font-size: 0.76rem;
      }
      .state::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .is-running .state {
        color: #59dd9f;
      }
      .empty {
        padding: 46px;
        border: 1px dashed #38516e;
        border-radius: 20px;
        color: #91a2b7;
        text-align: center;
      }
      @media (max-width: 700px) {
        main {
          padding: 42px 16px;
        }
        header {
          align-items: start;
          flex-direction: column;
          gap: 12px;
        }
        .pipeline-card {
          grid-template-columns: 1fr auto;
          gap: 18px;
        }
        .flow {
          display: none;
        }
        .node {
          grid-column: 1;
        }
        .actions {
          grid-column: 2;
          grid-row: 1 / span 2;
        }
        .statistics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Pipeline control</p>
          <h1>pipe-works</h1>
          <p class="subtitle">
            RTSP pipeline control — monitor every stream at a glance.
          </p>
        </div>
        <span class="count" id="pipeline-count">Loading...</span>
      </header>
      <section id="pipelines" aria-live="polite"></section>
    </main>
    <script>
      const icons = {
        play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.5-6.8c.6-.4.6-1.3 0-1.7L9.6 4.3c-.7-.4-1.6.1-1.6.9Z"/></svg>',
        stop: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',
        arrow:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 5 7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2l-4.6-4.6L13 5Z"/></svg>',
      };
      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>'"]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[char],
        );
      async function request(path) {
        return fetch(path, { method: "POST" });
      }
      function markConnectionsDisconnected() {
        document.querySelectorAll(".pipeline-card").forEach((card) => {
          card.classList.remove("is-running");
          card.querySelector(".state").textContent = "stopped";
          card.querySelector(".endpoint-state").textContent = "Stopped";
        });
        document.querySelectorAll(".endpoint-status").forEach((status) => {
          status.classList.remove("connected");
          status.classList.add("disconnected");
          status.querySelector("strong").textContent = "disconnected";
        });
      }
      function connectionStatus(statistics, field, isRunning) {
        if (!isRunning) {
          return "disconnected";
        }
        const value = statistics[field];
        return ["connected", "disconnected"].includes(value)
          ? value
          : "disconnected";
      }
      function createPipelineCard(pipeline) {
        const card = document.createElement("article");
        card.className = "pipeline-card";
        card.dataset.pipelineName = pipeline.name;
        const name = escapeHtml(pipeline.name);
        card.innerHTML = `<div class="pipeline-name"><small>Pipeline</small><strong title="${name}">${name}</strong><span class="state"></span></div><div class="flow" aria-hidden="true">${icons.arrow}</div><div class="node"><div class="node-icon"></div><div><small>Endpoint</small><span class="endpoint-state"></span><div class="endpoint-statuses"><span class="endpoint-status" data-connection="input">Input: <strong></strong></span><span class="endpoint-status" data-connection="output">Output: <strong></strong></span></div></div></div><div class="actions"><button type="button" title="Start" aria-label="Start ${name}" onclick="request('/api/pipelines/${encodeURIComponent(pipeline.name)}/start').then(refresh)">${icons.play}</button><button class="stop" type="button" title="Stop" aria-label="Stop ${name}" onclick="request('/api/pipelines/${encodeURIComponent(pipeline.name)}/stop').then(refresh)">${icons.stop}</button></div><dl class="statistics"><div class="statistic"><dt>Received</dt><dd data-stat="received_frame_count"></dd></div><div class="statistic"><dt>Sent</dt><dd data-stat="sent_frame_count"></dd></div><div class="statistic success"><dt>Inference OK</dt><dd data-stat="inference_success_frame_count"></dd></div><div class="statistic failure"><dt>Inference Failed</dt><dd data-stat="inference_failure_frame_count"></dd></div><div class="statistic failure"><dt>Out of Order</dt><dd data-stat="out_of_order_frame_count"></dd></div></dl>`;
        return card;
      }
      function updatePipelineCard(card, pipeline) {
        const isRunning = String(pipeline.state).toLowerCase() === "running";
        const statistics = pipeline.statistics || {};
        const count = (field) =>
          Number.isFinite(statistics[field])
            ? statistics[field].toLocaleString()
            : "0";
        card.classList.toggle("is-running", isRunning);
        card.querySelector(".state").textContent = pipeline.state;
        card.querySelector(".node-icon").innerHTML = isRunning ? icons.play : icons.stop;
        card.querySelector(".endpoint-state").textContent = isRunning ? "Streaming" : "Stopped";
        [
          "received_frame_count",
          "sent_frame_count",
          "inference_success_frame_count",
          "inference_failure_frame_count",
          "out_of_order_frame_count",
        ].forEach((field) => {
          card.querySelector(`[data-stat="${field}"]`).textContent = count(field);
        });
        [["input", "input_rtsp_status"], ["output", "output_rtsp_status"]].forEach(
          ([side, field]) => {
            const status = connectionStatus(statistics, field, isRunning);
            const endpointStatus = card.querySelector(`[data-connection="${side}"]`);
            endpointStatus.classList.remove("connected", "disconnected");
            endpointStatus.classList.add(status);
            endpointStatus.querySelector("strong").textContent = status;
          },
        );
      }
      async function refresh() {
        try {
          const response = await fetch("/api/pipelines");
          if (!response.ok) {
            throw new Error("Pipeline status request failed");
          }
          const pipelines = await response.json();
          document.querySelector("#pipeline-count").textContent =
            pipelines.length + " pipelines";
          const container = document.querySelector("#pipelines");
          const names = new Set(pipelines.map((pipeline) => pipeline.name));
          container.querySelectorAll(".pipeline-card").forEach((card) => {
            if (!names.has(card.dataset.pipelineName)) {
              card.remove();
            }
          });
          container.querySelector(".empty")?.remove();
          pipelines.forEach((pipeline) => {
            let card = Array.from(container.querySelectorAll(".pipeline-card")).find(
              (item) => item.dataset.pipelineName === pipeline.name,
            );
            if (!card) {
              card = createPipelineCard(pipeline);
              container.append(card);
            }
            updatePipelineCard(card, pipeline);
          });
          if (!pipelines.length) {
            container.insertAdjacentHTML(
              "beforeend",
              '<div class="empty">No pipelines available.</div>',
            );
          }
        } catch (_) {
          markConnectionsDisconnected();
        }
      }
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
