name: pipe2

# 입력 스트림
input:
  rtsp:
    url: rtsp://210.99.70.120:1935/live/cctv002.stream
    transport: tcp
    jitter_buffer: 10 # 버퍼링 (프레임 수)

# 출력 스트림
output:
  rtsp:
    url: rtsp://localhost:8554/cctv002
    transport: tcp

inference:
  gpuid: 0 # GPU 장치 번호
  interval_frames: 0 # 추론 주기 (프레임 수)
  input_format: native # 입력 프레임 포멧 (native, rgb, rgbp)
  frame_type: pytorch # 입력 프레임 타입 (pytorch)
  model: examples/inference.py # YOLO 차량 검출 모델 파일 경로
  parameters:
    model: yolo11n.pt
    confidence: 0.25

postprocess: examples/postprocess.py # 후처리 모델 파일 경로